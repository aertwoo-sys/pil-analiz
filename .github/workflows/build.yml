name: Derle ve yayınla

on:
  push:
    branches: [main]
    paths: ['src/**', 'res/**', 'AndroidManifest.xml', 'build.sh', '.github/workflows/**']
  workflow_dispatch:

# Varsayılan: sadece okuma. Yazma izni yalnızca bu iş için açılır.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.repository == 'aertwoo-sys/pil-analiz'
    permissions:
      contents: write
    steps:
      # Üçüncü taraf eylemler değişmez commit hash'ine sabitlenmiştir.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Derle ve imzala
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > imza.p12
          ./build.sh
          shred -u imza.p12

      - name: Güvenlik kontrolü (internet izni ve arka plan bileşeni olmamalı)
        run: |
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging PilAnalizi.apk | grep uses-permission
          if "$AAPT" dump badging PilAnalizi.apk | grep -q "android.permission.INTERNET"; then
            echo "HATA: INTERNET izni bulundu"; exit 1; fi
          if "$AAPT" dump xmltree PilAnalizi.apk AndroidManifest.xml | grep -qE "E: (service|receiver|provider)"; then
            echo "HATA: arka plan bileşeni bulundu"; exit 1; fi
          if "$AAPT" dump xmltree PilAnalizi.apk AndroidManifest.xml | grep -q "debuggable"; then
            echo "HATA: debuggable bulundu"; exit 1; fi
          sha256sum PilAnalizi.apk | tee PilAnalizi.apk.sha256

      - name: Sürüm yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          # Commit mesajı kabuğa doğrudan değil, ortam değişkeni olarak verilir (komut enjeksiyonu önlemi).
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          TAG: v1.${{ github.run_number }}
        run: |
          gh release create -R "$GITHUB_REPOSITORY" "$TAG" PilAnalizi.apk PilAnalizi.apk.sha256 \
            --title "Pil Analizi ${TAG#v}" \
            --notes "${COMMIT_MSG:-Elle tetiklendi}"
